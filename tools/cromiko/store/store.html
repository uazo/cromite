The Google Play graphics of CromIKO: the store icon, the feature graphic and
the phone screenshots, drawn with the logo, the feature icons and the screens
of the app (recreated at the 360 dp of a phone; the player is a capture of the

<html>
<head>
<meta charset="utf-8">
<title>CromIKO store graphics</title>
<style>
  @font-face { font-family: Inter; font-weight: 500; src: url(../fonts/inter-latin-500-normal.woff2); }
  @font-face { font-family: Inter; font-weight: 600; src: url(../fonts/inter-latin-600-normal.woff2); }
  @font-face { font-family: Inter; font-weight: 800; src: url(../fonts/inter-latin-800-normal.woff2); }
  @font-face { font-family: Inter; font-weight: 900; src: url(../fonts/inter-latin-900-normal.woff2); }
  @font-face { font-family: Roboto; font-weight: 400; src: url(../fonts/roboto-latin-400-normal.woff2); }
  @font-face { font-family: Roboto; font-weight: 500; src: url(../fonts/roboto-latin-500-normal.woff2); }
  @font-face { font-family: Roboto; font-weight: 700; src: url(../fonts/roboto-latin-700-normal.woff2); }

  :root {
    --ink: #1E212A;
    --peri: #5C7CFC;
    --peri-deep: #4B63E0;
    --muted: #4A4F60;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: #fff; -webkit-font-smoothing: antialiased; }

  /* ---- Slides ---------------------------------------------------------- */
  .slide {
    position: relative; overflow: hidden; font-family: Inter, sans-serif; color: var(--ink);
    background: linear-gradient(168deg, #F8F9FF 0%, #EFF1FE 52%, #E6E9FC 100%);
  }
  .blob { position: absolute; border-radius: 50%; }
  .deco { position: absolute; inset: 0; pointer-events: none; }
  .brand { position: absolute; left: 84px; top: 92px; }
  .headline {
    position: absolute; left: 84px; right: 70px; top: 196px; margin: 0;
    font-weight: 900; font-size: 104px; line-height: 1.02; letter-spacing: -0.04em;
  }
  .headline .acc { color: var(--peri); }
  .sub {
    position: absolute; left: 86px; right: 110px; margin: 0;
    font-weight: 500; font-size: 39px; line-height: 1.36; color: var(--muted); letter-spacing: -0.01em;
  }
  .chip {
    position: absolute; display: flex; align-items: center; gap: 20px;
    padding: 20px 30px 20px 20px; border-radius: 32px; background: rgba(255, 255, 255, 0.94);
    box-shadow: 0 18px 44px rgba(46, 56, 140, 0.16), 0 0 0 1.5px rgba(92, 124, 252, 0.14);
    font-weight: 600; font-size: 31px; letter-spacing: -0.01em; white-space: nowrap;
  }
  .chip .ic {
    width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center;
    background: rgba(92, 124, 252, 0.14); color: var(--peri-deep); flex: none;
  }
  .chip small { display: block; font-weight: 500; font-size: 24px; color: var(--muted); margin-top: 2px; }

  /* ---- Phone ----------------------------------------------------------- */
  .phone {
    position: absolute; border-radius: 96px; background: #15161B; padding: 18px;
    box-shadow: 0 60px 110px rgba(36, 44, 120, 0.30), 0 18px 40px rgba(36, 44, 120, 0.18),
                inset 0 0 0 3px #2B2D35, inset 0 0 0 6px #0C0D10;
  }
  .phone .glass { position: relative; overflow: hidden; border-radius: 78px; }
  .phone .btn { position: absolute; background: #1F2027; border-radius: 4px; }

  /* ---- Screens of the app (360 dp wide, 1 px = 1 dp) --------------------- */
  .ui {
    position: absolute; left: 0; top: 0; width: 360px; height: 780px; overflow: hidden;
    font-family: Roboto, sans-serif; color: var(--on); background: var(--bg);
    --bg: #FBFBFF; --on: #1B1C22; --var: #4A4D59; --p: #4F67DE; --onp: #FFFFFF;
    --tint: rgba(92, 124, 252, 0.12); --tint2: rgba(92, 124, 252, 0.20);
    --outline: rgba(27, 28, 34, 0.12); --bar: #EEF0FA; --card: #F2F3FB;
  }
  .ui.dark {
    --bg: #121318; --on: #E4E5EC; --var: #B7BAC8; --p: #A9B8FF; --onp: #10204F;
    --tint: rgba(169, 184, 255, 0.12); --tint2: rgba(169, 184, 255, 0.20);
    --outline: rgba(228, 229, 236, 0.14); --bar: #1F2128; --card: #1C1E25;
  }
  .ui.land { width: 780px; height: 360px; }
  .ui-status {
    height: 30px; display: flex; align-items: center; justify-content: space-between;
    padding: 2px 20px 0 24px; font-size: 13px; font-weight: 500; letter-spacing: 0.01em;
  }
  .ui-status .icons { display: flex; gap: 5px; align-items: center; }
  .ui-cam { position: absolute; top: 9px; left: 50%; width: 13px; height: 13px; margin-left: -6.5px;
            border-radius: 50%; background: #08090B; box-shadow: inset 0 0 0 2px #1C1D22; z-index: 9; }
  .ui-toolbar { height: 54px; display: flex; align-items: center; gap: 2px; padding: 0 4px 0 2px; }
  .ui-ib { width: 44px; height: 44px; display: grid; place-items: center; color: var(--on); flex: none; }
  .ui-omni { flex: 1; height: 42px; border-radius: 21px; background: var(--bar); display: flex;
             align-items: center; padding: 0 14px; gap: 10px; color: var(--var); font-size: 15px;
             white-space: nowrap; overflow: hidden; }
  .ui-omni b { font-weight: 400; color: var(--on); }
  .ui-tabs { width: 19px; height: 19px; border: 2px solid var(--on); border-radius: 5px; font-size: 10.5px;
             font-weight: 700; display: grid; place-items: center; }
  .ui-gesture { position: absolute; bottom: 7px; left: 50%; width: 108px; height: 4px; margin-left: -54px;
                border-radius: 2px; background: var(--on); opacity: 0.8; z-index: 20; }
  .ui-appbar { height: 56px; display: flex; align-items: center; gap: 18px; padding: 0 16px; font-size: 20px; }
  .ui-sec { font-size: 14px; font-weight: 500; color: var(--p); margin: 20px 20px 8px; }
  .ui-card { background: var(--tint); border-radius: 24px; }
  .ui-text-var { color: var(--var); }
  .ui-pill { display: inline-flex; align-items: center; gap: 8px; border-radius: 20px; padding: 10px 18px;
             font-size: 14px; font-weight: 500; }
  .ui-switch { width: 52px; height: 32px; border-radius: 16px; background: var(--p); position: relative; flex: none; }
  .ui-switch i { position: absolute; right: 4px; top: 4px; width: 24px; height: 24px; border-radius: 12px; background: var(--onp); }
  .ui-switch.off { background: transparent; box-shadow: inset 0 0 0 2px var(--var); }
  .ui-switch.off i { right: auto; left: 7px; top: 7px; width: 18px; height: 18px; background: var(--var); }
</style>
</head>

// Brand

const INK = '#1E212A', WHITE = '#FFFFFF', PERI = '#5C7CFC';
const P = A.logo;
const path = (d, fill, eo) => `<path d="${d}" fill="${fill}"${eo ? ' fill-rule="evenodd"' : ''}/>`;

// The mascot of the logo. 'logo': charcoal, as in the logo; 'light': white on dark, as in the app icon.
function mascotPaths(style) {
  const dark = style !== 'light';
  const body = dark ? INK : WHITE, face = dark ? WHITE : INK;
  // The gap inside the ring (Pfad 5) is a hole, so the mascot works on any background.
  return path(P['Pfad 1'] + ' ' + P['Pfad 5'], body, true) + path(P['Pfad 2'], face)
       + path(P['Pfad 3'], body) + path(P['Pfad 4'], body) + path(P['Pfad 6'], face)
       + path(P['Pfad 7'], body) + path(P['Pfad 8'], PERI) + path(P['Pfad 18'], PERI);
}
function wordPaths(color) {
  return path(P['Pfad 13'], color) + path(P['Pfad 17'], color) + path(P['Pfad 14'] + ' ' + P['Pfad 15'], color, true)
       + path(P['Pfad 11'], color) + path(P['Pfad 16'], color) + path(P['Pfad 12'], color)
       + path(P['Pfad 9'] + ' ' + P['Pfad 10'], color, true);
}
const mascot = (h, style = 'logo', extra = '') =>
  `<svg viewBox="455 583 600 495" height="${h}" width="${h * 600 / 495}" style="display:block;${extra}">${mascotPaths(style)}</svg>`;
const logo = (h, color = INK, style = 'logo') =>
  `<svg viewBox="455 583 1660 495" height="${h}" width="${h * 1660 / 495}" style="display:block">${mascotPaths(style)}${wordPaths(color)}</svg>`;
const wordmark = (h, color = INK) =>
  `<svg viewBox="1030 770 1085 212" height="${h}" width="${h * 1085 / 212}" style="display:block">${wordPaths(color)}</svg>`;

// The feature icons of the app (tools/cromiko/icons), in currentColor.
const icon = (name, size, extra = '') =>
  A.icons[name].replace('<svg ', `<svg style="display:block;${extra}" width="${size}" height="${size}" `);

// Material icons (Apache 2.0), as the app uses them.
const MI = {

};
const mi = (name, size = 24, color = 'currentColor', extra = '') =>
  `<svg viewBox="0 0 24 24" width="${size}" height="${size}" style="display:block;flex:none;${extra}"><path fill="${color}" d="${MI[name]}"/></svg>`;

// The four-point star of the logo, for decoration.
const STAR_D = 'M20.49,0.72C20.61,0.84 21.01,2.03 21.16,2.29C21.57,2.98 22.68,3.26 23.40,3.45C21.41,4.04 21.09,4.30 20.53,6.28C19.76,4.22 19.86,4.04 17.60,3.47C19.58,2.85 19.89,2.72 20.49,0.72Z';
const star = (x, y, size, opacity = 0.9, color = PERI) =>
  `<svg viewBox="17.3 0.4 6.4 6.2" width="${size}" height="${size}" style="position:absolute;left:${x}px;top:${y}px;opacity:${opacity}"><path fill="${color}" d="${STAR_D}"/></svg>`;

// Soft background: blobs, an orbit like the ring of the mascot, and stars.
function backdrop(w, h, layout) {
  const blobs = layout.blobs.map(([x, y, r, c, a]) =>
    `<div class="blob" style="left:${x - r}px;top:${y - r}px;width:${2 * r}px;height:${2 * r}px;` +
    `background:radial-gradient(circle at 50% 50%, rgba(${c},${a}) 0%, rgba(${c},${a * 0.55}) 45%, rgba(${c},0) 70%)"></div>`).join('');
  const orbits = (layout.orbits || []).map(([cx, cy, rx, ry, rot, dots]) =>
    `<g transform="rotate(${rot} ${cx} ${cy})"><ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="none" ` +
    `stroke="rgba(92,124,252,0.30)" stroke-width="3"/>` +
    (dots || []).map((a) => `<circle cx="${cx + rx * Math.cos(a)}" cy="${cy + ry * Math.sin(a)}" r="9" fill="${PERI}"/>`).join('') + '</g>').join('');
  const stars = (layout.stars || []).map(([x, y, s, o]) => star(x, y, s, o)).join('');
  return `<div class="deco">${blobs}<svg width="${w}" height="${h}" style="position:absolute;left:0;top:0">${orbits}</svg>${stars}</div>`;
}

// A phone with |screen| (a .ui element of 360 x 780 dp, or 780 x 360 for |land|), |width| px wide.
function phone(screen, { x, y, width, rotate = 0, land = false, z = 2 }) {
  const dpW = land ? 780 : 360, dpH = land ? 360 : 780;
  const pad = Math.round(width * 0.024), inner = width - 2 * pad, scale = inner / dpW;
  const height = dpH * scale + 2 * pad;
  const buttons = land
    ? `<div class="btn" style="top:-5px;left:${width * 0.62}px;width:90px;height:6px"></div><div class="btn" style="top:-5px;left:${width * 0.44}px;width:140px;height:6px"></div>`
    : `<div class="btn" style="right:-5px;top:${height * 0.22}px;width:6px;height:90px"></div><div class="btn" style="right:-5px;top:${height * 0.33}px;width:6px;height:150px"></div>`;
  const radius = (land ? height : width) * 0.126;
  return `<div class="phone" style="left:${x}px;top:${y}px;width:${width}px;height:${height}px;z-index:${z};` +
    `padding:${pad}px;border-radius:${radius}px;transform:rotate(${rotate}deg)">${buttons}` +
    `<div class="glass" style="width:${inner}px;height:${dpH * scale}px;border-radius:${radius - pad}px">` +
    `<div style="position:absolute;left:0;top:0;width:${dpW}px;height:${dpH}px;transform:scale(${scale});transform-origin:0 0">` +
    screen + '</div></div></div>';
}

// ---------------------------------------------------------------------------
// Parts of the screens

function statusBar(time = '12:20') {
  const battery = `<svg width="24" height="13" viewBox="0 0 24 13"><rect x="0.8" y="0.8" width="20" height="11.4" rx="3.4" fill="none" stroke="currentColor" stroke-width="1.4" opacity="0.5"/><rect x="2.6" y="2.6" width="13" height="7.8" rx="1.8" fill="currentColor"/><rect x="22" y="4.2" width="1.6" height="4.6" rx="0.8" fill="currentColor" opacity="0.5"/></svg>`;
  return `<div class="ui-status"><span>${time}</span><span class="icons">${mi('wifi', 16)}${mi('signal', 14)}${battery}</span></div><div class="ui-cam"></div>`;
}
function toolbar(url) {
  const box = url
    ? `${mi('tune', 18)}<span><b>${url}</b></span>`
    : `${mi('search', 20)}<span>Search or type URL</span>`;
  return `<div class="ui-toolbar"><div class="ui-ib">${mi('home', 24)}</div><div class="ui-omni">${box}</div>` +
    `<div class="ui-ib"><div class="ui-tabs">1</div></div><div class="ui-ib">${mi('more', 24)}</div></div>`;
}
const gesture = '<div class="ui-gesture"></div>';

// A cover of an (invented) manga series: |hue| for the colors.
function cover(title, hue, w = 86, h = 118, pose = 0) {
  const c1 = `hsl(${hue},62%,58%)`, c2 = `hsl(${(hue + 40) % 360},70%,28%)`;
  const stars = [[14, 18, 7], [70, 30, 5], [62, 12, 4], [20, 62, 4]].map(([x, y, s]) =>
    `<path transform="translate(${x - 17.3 * s / 6.4} ${y}) scale(${s / 6.4})" fill="#fff" opacity="0.85" d="${STAR_D}"/>`).join('');
  return `<svg width="${w}" height="${h}" viewBox="0 0 86 118" style="display:block;border-radius:10px">
    <defs><linearGradient id="cg${hue}${pose}" x1="0" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs>
    <rect width="86" height="118" fill="url(#cg${hue}${pose})"/>
    <circle cx="${pose ? 22 : 64}" cy="${pose ? 30 : 34}" r="18" fill="#fff" opacity="0.16"/>${stars}
    <g transform="translate(${pose ? 18 : 10} ${pose ? 40 : 34}) scale(${pose ? 0.105 : 0.115}) translate(-455 -583)">${mascotPaths('light')}</g>
    <rect y="86" width="86" height="32" fill="rgba(10,12,30,0.55)"/>
    <text x="7" y="101" font-family="Inter" font-weight="900" font-size="10.5" fill="#fff" letter-spacing="-0.2">${title[0]}</text>
    <text x="7" y="112" font-family="Inter" font-weight="900" font-size="10.5" fill="#fff" letter-spacing="-0.2">${title[1] || ''}</text>
  </svg>`;
}

// A black-and-white manga page with the mascot (original art): |kind| 0 or 1.
function comicPage(kind) {
  const W = 360, H = 520, m = 10, g = 8;
  const tone = (id, gap = 5, r = 1.1) => `<pattern id="${id}" width="${gap}" height="${gap}" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="${gap / 2}" cy="${gap / 2}" r="${r}" fill="#222"/></pattern>`;
  const lines = (cx, cy, n, r0, r1, seed = 1) => {
    let s = '';
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + ((i * 7919 * seed) % 13) / 30;
      const ra = r0 + ((i * 37) % 17), w = 0.6 + ((i * 13) % 5) / 3;
      s += `<line x1="${cx + Math.cos(a) * ra}" y1="${cy + Math.sin(a) * ra}" x2="${cx + Math.cos(a) * r1}" y2="${cy + Math.sin(a) * r1}" stroke="#111" stroke-width="${w}"/>`;
    }
    return s;
  };
  const bubble = (x, y, w, h, text, tailX, tailY, size = 13) =>
    `<g><ellipse cx="${x}" cy="${y}" rx="${w / 2}" ry="${h / 2}" fill="#fff" stroke="#111" stroke-width="2"/>` +
    `<path d="M${x - 8},${y + h / 2 - 3} L${tailX},${tailY} L${x + 8},${y + h / 2 - 3}" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round"/>` +
    `<rect x="${x - 10}" y="${y + h / 2 - 6}" width="20" height="5" fill="#fff"/>` +
    text.split('\n').map((t, i, all) => `<text x="${x}" y="${y + (i - (all.length - 1) / 2) * (size + 2) + size / 3}" text-anchor="middle" font-family="Inter" font-weight="800" font-size="${size}" fill="#111">${t}</text>`).join('') + '</g>';
  const mascotAt = (x, y, s, rot = 0, style = 'logo') =>
    `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s}) translate(-755 -830)">${mascotPaths(style)}</g>`;
  const city = (y0, x0, x1) => {
    let s = '', x = x0, i = 0;
    while (x < x1) {
      const w = 18 + ((i * 29) % 22), h = 30 + ((i * 53) % 70);
      s += `<rect x="${x}" y="${y0 - h}" width="${w}" height="${h}" fill="#1a1a1a"/>`;
      for (let wy = y0 - h + 6; wy < y0 - 6; wy += 9) for (let wx = x + 4; wx < x + w - 4; wx += 7) if (((wx * 7 + wy * 3 + i) % 5) < 2) s += `<rect x="${wx}" y="${wy}" width="3" height="4" fill="#fff"/>`;
      x += w + 2; i++;
    }
    return s;
  };
  let body = '';
  if (kind === 0) {
    // Panel 1: the mascot flies over the city at night. Panel 2: close-up. Panel 3: pop-ups shatter.
    const p1h = 228, p2w = 150, p2y = m + p1h + g, p2h = H - p2y - m;
    body += `<defs><clipPath id="k1"><rect x="${m}" y="${m}" width="${W - 2 * m}" height="${p1h}"/></clipPath><clipPath id="k2"><rect x="${m}" y="${p2y}" width="${p2w}" height="${p2h}"/></clipPath><clipPath id="k3"><rect x="${m + p2w + g}" y="${p2y}" width="${W - 2 * m - p2w - g}" height="${p2h}"/></clipPath>${tone('t1')}${tone('t2', 4, 0.9)}</defs>`;
    body += `<g clip-path="url(#k1)"><rect x="0" y="0" width="${W}" height="${H}" fill="url(#t1)"/><rect x="0" y="0" width="${W}" height="${H}" fill="#fff" opacity="0.35"/>` +
      `<circle cx="270" cy="70" r="34" fill="#fff" stroke="#111" stroke-width="2"/>` + city(m + p1h, -4, W + 10) +
      lines(150, 120, 26, 70, 260, 2) + mascotAt(150, 118, 0.2, -12) +
      `<path d="M60,160 Q100,150 112,128" fill="none" stroke="#111" stroke-width="2" stroke-dasharray="4 5"/></g>` +
      `<rect x="${m}" y="${m}" width="${W - 2 * m}" height="${p1h}" fill="none" stroke="#111" stroke-width="3"/>` +
      `<rect x="${m + 10}" y="${m + 10}" width="150" height="38" fill="#fff" stroke="#111" stroke-width="2"/>` +
      `<text x="${m + 20}" y="${m + 26}" font-family="Inter" font-weight="900" font-size="11" fill="#111">CHAPTER 12</text>` +
      `<text x="${m + 20}" y="${m + 41}" font-family="Inter" font-weight="600" font-size="11" fill="#111">The Pop-up Storm</text>`;
    body += `<g clip-path="url(#k2)"><rect x="0" y="0" width="${W}" height="${H}" fill="#fff"/>` + lines(m + p2w / 2, p2y + p2h / 2 + 10, 60, 40, 200, 3) +
      mascotAt(m + p2w / 2, p2y + p2h / 2 + 34, 0.27, 0) + `</g>` +
      `<rect x="${m}" y="${p2y}" width="${p2w}" height="${p2h}" fill="none" stroke="#111" stroke-width="3"/>` +
      bubble(m + p2w / 2, p2y + 42, 126, 52, 'Not on my\nwatch!', m + p2w / 2 + 10, p2y + 86);
    const x3 = m + p2w + g, w3 = W - 2 * m - p2w - g;
    let pops = '';
    [[18, 30, 70, 50, -14], [88, 64, 66, 46, 10], [30, 120, 74, 52, 6], [104, 148, 60, 42, -8], [52, 196, 70, 48, 14]].forEach(([px, py, pw, ph, r], i) => {
      pops += `<g transform="translate(${x3 + px} ${p2y + py}) rotate(${r})"><rect width="${pw}" height="${ph}" fill="#fff" stroke="#111" stroke-width="2"/><rect width="${pw}" height="10" fill="#111"/>` +
        `<path d="M${pw - 9},2 l6,6 M${pw - 3},2 l-6,6" stroke="#fff" stroke-width="1.6"/><rect x="6" y="16" width="${pw - 12}" height="5" fill="url(#t2)"/><rect x="6" y="25" width="${pw - 24}" height="5" fill="url(#t2)"/>` +
        `<path d="M${pw * 0.3},${ph} l${pw * 0.15},-${ph * 0.45} l${pw * 0.1},${ph * 0.2} l${pw * 0.12},-${ph * 0.4}" fill="none" stroke="#111" stroke-width="1.6"/></g>`;
    });
    body += `<g clip-path="url(#k3)"><rect x="0" y="0" width="${W}" height="${H}" fill="#fff"/>` + lines(x3 + w3 / 2, p2y + p2h / 2, 40, 20, 220, 5) + pops +
      `<text x="${x3 + w3 / 2}" y="${p2y + p2h - 22}" text-anchor="middle" font-family="Inter" font-weight="900" font-size="30" fill="#fff" stroke="#111" stroke-width="2.5" paint-order="stroke" transform="rotate(-8 ${x3 + w3 / 2} ${p2y + p2h - 30})">BLOCKED!</text></g>` +
      `<rect x="${x3}" y="${p2y}" width="${w3}" height="${p2h}" fill="none" stroke="#111" stroke-width="3"/>`;
  } else {
    // Panel 1: the mascot reads a book at home. Panel 2: wide shot, stars.
    const p1h = 250, p2y = m + p1h + g, p2h = H - p2y - m;
    body += `<defs><clipPath id="q1"><rect x="${m}" y="${m}" width="${W - 2 * m}" height="${p1h}"/></clipPath><clipPath id="q2"><rect x="${m}" y="${p2y}" width="${W - 2 * m}" height="${p2h}"/></clipPath>${tone('u1', 6, 1.3)}${tone('u2', 4, 0.8)}</defs>`;
    body += `<g clip-path="url(#q1)"><rect x="0" y="0" width="${W}" height="${H}" fill="#fff"/><rect x="0" y="${m + 170}" width="${W}" height="120" fill="url(#u2)"/>` +
      `<rect x="40" y="${m + 40}" width="90" height="70" fill="#fff" stroke="#111" stroke-width="2"/><line x1="85" y1="${m + 40}" x2="85" y2="${m + 110}" stroke="#111" stroke-width="2"/><line x1="40" y1="${m + 75}" x2="130" y2="${m + 75}" stroke="#111" stroke-width="2"/>` +
      `<path d="M180,${m + 196} q50,-28 110,0 v24 h-110z" fill="#fff" stroke="#111" stroke-width="2"/>` +
      mascotAt(236, m + 140, 0.19, 4) +
      `<g transform="translate(206 ${m + 150}) rotate(-6)"><rect width="60" height="40" fill="#fff" stroke="#111" stroke-width="2"/><line x1="30" y1="0" x2="30" y2="40" stroke="#111" stroke-width="2"/></g>` +
      bubble(110, m + 160, 130, 46, 'One more\nchapter…', 190, m + 180, 12) + `</g>` +
      `<rect x="${m}" y="${m}" width="${W - 2 * m}" height="${p1h}" fill="none" stroke="#111" stroke-width="3"/>`;
    body += `<g clip-path="url(#q2)"><rect x="0" y="0" width="${W}" height="${H}" fill="#111"/>` +
      [[40, 20, 6], [120, 60, 4], [300, 30, 7], [250, 90, 3], [70, 130, 4], [330, 150, 5], [180, 24, 3]].map(([x, y, s]) => `<path transform="translate(${x - 17.3 * s / 6.4 * 3} ${p2y + y}) scale(${s / 6.4 * 3})" fill="#fff" d="${STAR_D}"/>`).join('') +
      mascotAt(180, p2y + p2h / 2 + 10, 0.25, -6, 'light') +
      `<text x="${W / 2}" y="${p2y + p2h - 18}" text-anchor="middle" font-family="Inter" font-weight="800" font-size="13" fill="#fff" letter-spacing="3">TO BE CONTINUED</text></g>` +
      `<rect x="${m}" y="${p2y}" width="${W - 2 * m}" height="${p2h}" fill="none" stroke="#111" stroke-width="3"/>`;
  }
  return `<svg width="360" height="520" viewBox="0 0 360 520" style="display:block;background:#fff">${body}</svg>`;
}

// The drawing of CromikoDnsOrbitView.onDraw, at 2 px per dp.
function drawOrbits() {
  const ICON = A.dnsIcon;
  document.querySelectorAll('canvas[data-orbit]').forEach((c) => {
    const g = c.getContext('2d'), d = 2, t = 1.35, on = 1, color = '#4F67DE';
    const alpha = (a) => `rgba(79,103,222,${a})`;
    const cx = c.width / 2, cy = c.height / 2, scale = Math.min(1, c.height / (100 * d * 2.2));
    const pulse = 0.5 + 0.5 * Math.sin(t * 2.2);
    g.fillStyle = alpha((24 + 20 * pulse) / 255); g.beginPath(); g.arc(cx, cy, (52 + 8 * pulse) * d * scale, 0, 7); g.fill();
    [[150, 52, -18, 5200], [200, 70, 24, 7300], [250, 88, -62, 9800]].forEach((o, i) => {
      const rx = o[0] / 2 * d * scale, ry = o[1] / 2 * d * scale;
      g.save(); g.translate(cx, cy); g.rotate(o[2] * Math.PI / 180);
      g.strokeStyle = alpha((0.18 + 0.22 * on) * (1 - i * 0.18)); g.lineWidth = 2 * d; g.beginPath(); g.ellipse(0, 0, rx, ry, 0, 0, 7); g.stroke();
      const angle = 2 * Math.PI * (t * 1000 / o[3] + i * 0.37);
      for (let k = 6; k >= 0; k--) { const a = angle - k * 0.12; g.fillStyle = alpha(on * (1 - k / 7)); g.beginPath(); g.arc(rx * Math.cos(a), ry * Math.sin(a), (k == 0 ? 4.5 : 3.2 - k * 0.3) * d, 0, 7); g.fill(); }
      g.restore();
    });
    g.fillStyle = color; g.beginPath(); g.arc(cx, cy, 36 * d * scale, 0, 7); g.fill();
    g.save(); const half = 18 * d * scale; g.translate(cx - half, cy - half); g.scale(2 * half / 24, 2 * half / 24); g.fillStyle = '#fff';
    ICON.forEach((p) => g.fill(new Path2D(p), 'evenodd')); g.restore();
    [[0.16, 0.24, 9], [0.84, 0.20, 12], [0.10, 0.74, 7], [0.88, 0.78, 8], [0.70, 0.08, 6]].forEach((s, i) => {
      const tw = 0.5 + 0.5 * Math.sin(t * 1.7 + i * 1.3), r = s[2] * d * (0.6 + 0.4 * tw), x = s[0] * c.width, y = s[1] * c.height, q = r * 0.18;
      g.fillStyle = alpha((0.35 + 0.65 * tw)); g.beginPath(); g.moveTo(x, y - r); g.quadraticCurveTo(x + q, y - q, x + r, y); g.quadraticCurveTo(x + q, y + q, x, y + r);
      g.quadraticCurveTo(x - q, y + q, x - r, y); g.quadraticCurveTo(x - q, y - q, x, y - r); g.fill();
    });
  });
}

    <div style="position:absolute;left:60px;top:300px;font-weight:500;font-size:22px;line-height:1.4;color:#4A4F60;width:470px">Ad blocking, encrypted DNS and<br>a pop-up guard, all built in.</div>
    <div style="position:absolute;left:58px;top:390px;display:flex;gap:10px">${[['adblock', 'Ad blocking'], ['dns', 'CromIKO DNS'], ['fire', 'Fire button']].map(([i, t]) =>
      `<div style="display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.9);border-radius:16px;padding:8px 14px 8px 10px;font-weight:600;font-size:15px;box-shadow:0 6px 18px rgba(46,56,140,0.12);color:#1E212A"><span style="color:#4B63E0">${icon(i, 20)}</span>${t}</div>`).join('')}</div>
    ${phone(screenNtp(), { x: 560, y: 46, width: 250, rotate: -6 })}
    ${phone(screenGuard(), { x: 760, y: 92, width: 230, rotate: 7, z: 3 })}
  </div>`;
}

function renderIcon() {
  // Like the launcher icon: the white mascot on charcoal, full bleed (Google Play rounds the corners).
  document.body.innerHTML = `<div style="width:512px;height:512px;background:#1E2024;display:grid;place-items:center">
    <svg viewBox="455 583 600 495" width="372" height="307" style="display:block;transform:translate(6px,4px)">${mascotPaths('light')}</svg></div>`;
}

// A frame of the video in the player: an evening over a city, with the mascot flying (original art).
function renderVideoFrame() {
  const w = 1280, h = 720;
  let city = '', x = -20, i = 0;
  while (x < w + 40) {
    const bw = 50 + ((i * 37) % 70), bh = 120 + ((i * 71) % 230), y0 = h - 40;
    city += `<rect x="${x}" y="${y0 - bh}" width="${bw}" height="${bh + 40}" fill="hsl(250,35%,${9 + (i % 3) * 3}%)"/>`;
    for (let wy = y0 - bh + 14; wy < y0; wy += 22) for (let wx = x + 10; wx < x + bw - 10; wx += 16) if (((wx * 7 + wy * 3 + i * 11) % 9) < 3)
      city += `<rect x="${wx}" y="${wy}" width="7" height="10" fill="hsl(${40 + (wx % 30)},90%,${70 + (wy % 15)}%)" opacity="0.85"/>`;
    x += bw + 6; i++;
  }
  const stars = Array.from({ length: 70 }, (_, k) => `<circle cx="${(k * 977) % w}" cy="${(k * 431) % 330}" r="${1 + (k % 3) * 0.6}" fill="#fff" opacity="${0.4 + (k % 5) / 10}"/>`).join('');
  document.body.innerHTML = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block">
    <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1A1446"/><stop offset="0.55" stop-color="#5B3A8C"/><stop offset="0.85" stop-color="#E0789A"/><stop offset="1" stop-color="#F6B07A"/></linearGradient>
      <radialGradient id="moon"><stop offset="0" stop-color="#FFF6E0"/><stop offset="0.7" stop-color="#FFE4B0"/><stop offset="1" stop-color="#FFE4B0" stop-opacity="0"/></radialGradient></defs>
    <rect width="${w}" height="${h}" fill="url(#sky)"/>${stars}
    <circle cx="980" cy="190" r="120" fill="url(#moon)" opacity="0.9"/>
    <ellipse cx="980" cy="190" rx="190" ry="40" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="5" transform="rotate(-14 980 190)"/>
    <g opacity="0.95">${city}</g>
    <path d="M140,430 C320,380 420,330 520,250" fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="5" stroke-dasharray="2 18" stroke-linecap="round"/>
    <g transform="translate(600 210) rotate(-14) scale(0.36) translate(-755 -830)">${mascotPaths('light')}</g>
  </svg>`;
}

const id = location.hash.slice(1);
if (id === 'feature') renderFeature();
else if (id === 'icon') renderIcon();
else if (id === 'videoframe') renderVideoFrame();
else renderSlide(id || 's1');
drawOrbits();
document.fonts.ready.then(() => { document.body.dataset.ready = '1'; });
</script>
</body>
</html>
