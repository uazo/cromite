<script>
const report=JSON.parse(document.getElementById('reportJson').textContent);

function refs(value){const text=String(value??''),pattern=/https:\/\/(?:issues\.chromium\.org\/issues\/\d+|chromium-review\.googlesource\.com\/c\/chromium\/src\/\+\/\d+)|\b\d{6,9}\b/gi;let html='',offset=0,match;while((match=pattern.exec(text))!==null){html+=esc(text.slice(offset,match.index));const token=match[0];if(token.startsWith('https://')){html+='<a href="'+esc(token)+'" target="_blank" rel="noopener noreferrer">'+esc(token)+'</a>';}else{const prefix=text.slice(Math.max(0,match.index-120),match.index);const isGerrit=/(?:gerrit(?:changes?|change|changeid|id)?)\D{0,80}$/i.test(prefix);const isBug=!isGerrit&&(/(?:bug(?:ids?)?|chromium|crbug(?:\.com)?)\D{0,24}$/i.test(prefix)||token.length>=8);const href=isBug?'https://issues.chromium.org/issues/'+token:'https://chromium-review.googlesource.com/c/chromium/src/+/'.concat(token);html+='<a href="'+href+'" target="_blank" rel="noopener noreferrer">'+esc(token)+'</a>';}offset=pattern.lastIndex;}return html+esc(text.slice(offset));}
